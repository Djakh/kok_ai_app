name: kok_ai_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  livekit_client: ^2.6.3
  permission_handler: ^11.3.1
  flutter_bloc: ^9.0.0
  get_it: ^7.7.0
  dio: ^5.7.0
  logger: ^2.6.2
  equatable: ^2.0.5
  go_router: ^14.3.0
  flutter_tts: ^3.8.5
  audioplayers: ^6.1.0
  record: ^5.1.2
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8
  dotted_border: ^3.1.0
  cached_network_image: ^3.4.1
  dio_cache_interceptor: ^3.5.0
  easy_localization: ^3.0.7
  flutter_svg: ^2.2.3
  file_picker: ^8.0.6
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.0.0
  flutter_widget_from_html_core: ^0.15.1
  google_maps_flutter: ^2.12.3
  geolocator: ^13.0.2
  camera: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/translations/
